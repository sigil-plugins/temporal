[package]
name = "sigil-temporal"
version = "0.1.1-rc.1"
edition = "2024"
license = "MIT"
publish = false
description = "Bounded Temporal WorkflowService client for Sigil"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]
members = ["."]
exclude = ["tools/codegen"]
resolver = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[dependencies]
prost = "=0.14.4"
prost-types = "=0.14.4"
serde = "=1.0.229"
serde_json = "=1.0.151"
wit-bindgen = "=0.57.1"
